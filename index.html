<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KML → GEXP Converter</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>KML → GEXP Converter</h1>
    <p class="subtitle">
        Convert Google Earth KML polygons into GEXP geofence files.
    </p>

    <div class="card">

        <label>KML File</label>
        <input
            type="file"
            id="kmlFile"
            accept=".kml"
        >

        <label>Group Name</label>
        <input
            type="text"
            id="groupName"
            placeholder="Example: PP Site Mempawah"
            value="Default Group"
        >

        <!-- <label>Group ID</label> -->
        <input
            type="number"
            id="groupId"
            value="1"
        >

        <label>Polygon Color</label>

        <div class="colorRow">
            <input
                type="color"
                id="polygonColor"
                value="#724646"
            >

            <span id="colorValue">
                #724646
            </span>
        </div>

        <button id="convertBtn">
            Convert
        </button>

    </div>

    <div class="card">

        <h3>Result</h3>

        <pre id="output">
Waiting for conversion...
        </pre>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
